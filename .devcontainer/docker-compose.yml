# AivoCode docker-compose stack — devcontainer + REST API server.
#
# /workspaces is a shared named volume — any new subdirectories created
# in one container are immediately visible in the other.
# The AivoCode repo is bind-mounted at /workspaces/aivocode in both.
#
# Usage:
#   docker compose -f .devcontainer/docker-compose.yml up -d
#   docker compose -f .devcontainer/docker-compose.yml exec devcontainer bash
#   docker compose -f .devcontainer/docker-compose.yml down
services:
  aivocode:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    volumes:
      - workspaces:/workspaces
      - ..:/workspaces/aivocode
    env_file:
      - ../.aivocode.env

  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - workspaces:/workspaces
      - ..:/workspaces/aivocode
    command: sleep infinity
    depends_on:
      - aivocode

volumes:
  workspaces:
